<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SmartPrice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-container">
                    <div class="text-center mb-4">
                        <!-- Logo que redirige a home -->
                        <a href="{{ url_for('home') }}" style="text-decoration: none;">
                            <h2 class="fw-bold" style="color: var(--primary-blue);">🛒 SmartPrice</h2>
                        </a>
                        <p class="text-muted">Inicia sesión para comparar precios</p>
                    </div>
                    
                    <!-- Formulario que redirige a home -->
                    <form action="{{ url_for('home') }}" method="get">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="tu@email.com">
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••">
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Mantener sesión iniciada</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">Iniciar sesión</button>
                    </form>
                    
                    <!-- Enlace para entrar directamente -->
                    <div class="text-center mt-3">
                        <a href="{{ url_for('home') }}" class="btn btn-outline-primary btn-sm">Entrar como invitado</a>
                    </div>
                    
                    <div class="text-center mt-2">
                        <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p class="mb-0">¿No tienes una cuenta? <a href="#" class="text-decoration-none fw-bold">Regístrate</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
